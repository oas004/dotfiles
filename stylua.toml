# StyLua (https://github.com/JohnnyMorganz/StyLua) config. `make lint` and CI
# run `stylua --check` over init.lua, lua/, tests/ and .github/scripts/ with
# the version pinned in .github/workflows/test.yml. `make format` rewrites the
# files in place.
#
# Most of the code was already written to these settings: double quotes and
# lines under 120 columns, with parentheses on every call.
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
