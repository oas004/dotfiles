name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TREE_SITTER_VERSION: v0.27.2
  SELENE_VERSION: 0.32.0
  LUALS_VERSION: 3.19.2
  SHELLCHECK_VERSION: 0.11.0
  STYLUA_VERSION: 2.6.0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install selene
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o "$RUNNER_TEMP/selene.zip" \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-light-${SELENE_VERSION}-linux.zip"
          unzip -o "$RUNNER_TEMP/selene.zip" -d ~/.local/bin
          chmod +x ~/.local/bin/selene
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/selene --version

      - name: Install lua-language-server
        run: |
          mkdir -p ~/.local/opt/lua-language-server
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar xz -C ~/.local/opt/lua-language-server
          echo "$HOME/.local/opt/lua-language-server/bin" >> "$GITHUB_PATH"
          ~/.local/opt/lua-language-server/bin/lua-language-server --version

      # The runner's apt shellcheck is older and changes with the image, so
      # pin a release. ~/.local/bin comes first on PATH, ahead of /usr/bin.
      - name: Install shellcheck
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar xJ -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" ~/.local/bin/shellcheck
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/shellcheck --version

      # A different stylua release can format the same code differently, so
      # pin one. Use the same version locally (stylua --version).
      - name: Install stylua
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -o "$RUNNER_TEMP/stylua.zip" -d ~/.local/bin
          chmod +x ~/.local/bin/stylua
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/stylua --version

      # Only for its runtime: `make lint` points lua-language-server at
      # $VIMRUNTIME so vim.* is type-checked against the 0.12 API.
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6

      - name: Lint
        run: make lint

  # Branch protection requires the check named "test"; keep this job id and
  # the name of the 0.11 entry stable. The 0.12 entry reports as
  # "test-nvim-0.12" and is not a required check.
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            nvim: v0.11.4
          - name: test-nvim-0.12
            nvim: v0.12.6
    env:
      NVIM_VERSION: ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ env.NVIM_VERSION }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # rust-analyzer comes from rustup, not Mason, as in bootstrap.sh
      - name: Install rust-analyzer
        run: rustup component add rust-analyzer && rust-analyzer --version

      # nvim-treesitter's main branch compiles parsers with the tree-sitter CLI
      - name: Install tree-sitter CLI
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL "https://github.com/tree-sitter/tree-sitter/releases/download/${TREE_SITTER_VERSION}/tree-sitter-linux-x64.gz" \
            | gunzip > ~/.local/bin/tree-sitter
          chmod +x ~/.local/bin/tree-sitter
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/tree-sitter --version

      - name: Use this checkout as the Neovim config
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim

      # kotlin-lsp is installed by Mason in the warm-up step below
      - name: Restore plugins from lazy-lock.json
        # Loading the config starts nvim-treesitter's background parser
        # installs. Wait for them before quitting: +qa alone leaves
        # half-finished installs in ~/.cache/nvim that the warm-up then
        # collides with (ENOTEMPTY renames, dlopen failures).
        run: >-
          nvim --headless "+Lazy! restore"
          "+lua require('nvim-treesitter').install(vim.g.treesitter_parsers):wait(300000)"
          +qa

      # On 0.12 lua/plugins/parser.lua drops the commit pin, so nvim-treesitter
      # is meant to follow main. lazy-lock.json still records the 0.11 pin,
      # though, so the restore above checks that out and the 0.12 job would
      # never run current main. Move it to main HEAD here and update the
      # parsers to the revisions that HEAD expects (update() joins the
      # installs the :TSUpdate build hook starts). The tradeoff: this job now
      # tests whatever main is today, so an upstream change can turn it red
      # without a change in this repo, and the run is not reproducible from
      # lazy-lock.json. The 0.11 job keeps testing the pinned commit. The
      # resulting lockfile change only lives in this runner and is never
      # committed.
      - name: Move nvim-treesitter to main HEAD (0.12 only)
        if: matrix.name == 'test-nvim-0.12'
        run: >-
          nvim --headless "+Lazy! update nvim-treesitter"
          "+lua require('nvim-treesitter').update():wait(300000)"
          +qa
          && git -C ~/.local/share/nvim/lazy/nvim-treesitter log --oneline -1

      # Let Mason and nvim-treesitter finish their background installs once,
      # so each test's fresh nvim doesn't restart and abandon them. This is
      # also where Mason installs the servers (kotlin-lsp included) and the
      # formatters in vim.g.mason_tools.
      - name: Warm up (Mason servers and formatters, treesitter parsers)
        timeout-minutes: 10
        run: nvim --headless -c "luafile .github/scripts/ci_warmup.lua"

      - name: Run tests
        env:
          SMOKE_EXTS: lua rs kt
        run: tests/run.sh
